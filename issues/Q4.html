<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Global Riot Graphs — Q4</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q4")</script></head><body><main id="issue"><h2 class="desk">Q4. Long-Run Context: France Is the Outlier on Protest Violence</h2><figure class="g"><img src="img/G08.webp" alt="Graph 8" loading="lazy"><figcaption><p>Graph 8. Anti-government protests (50+ participants) and the share involving protester violence, France vs Germany vs UK, 1990-2020. Over 1990-2020, 35% of coded French protests involved protester violence, vs 19% in the UK and 14% in Germany; for 2015-2020 the shares were 39%, 10% and 8%. Source: Clark &amp; Regan, Mass Mobilization Protest Data (<a href="https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/HTTWYL" target="_blank" rel="noopener">Mass Mobilization Project (Harvard Dataverse)</a>). Coverage ends in 2020; the US is not covered.</p></figcaption></figure>
<figure class="g"><img src="img/G09.webp" alt="Graph 9" loading="lazy"><figcaption><p>Graph 9. &quot;Significant&quot; anti-government protests in the Carnegie Global Protest Tracker, by country or region. France 36 (2 flagged violent), Germany 20 (0), UK 19 (0), US 22 (2), South America 94 (20); 1,054 protests worldwide, 186 flagged violent. Source: <a href="https://carnegieendowment.org/features/global-protest-tracker" target="_blank" rel="noopener">Carnegie Global Protest Tracker</a> (table downloaded Oct 21, 2026). The tracker had not yet added the October 2026 French wave.</p></figcaption></figure></main></body></html>
