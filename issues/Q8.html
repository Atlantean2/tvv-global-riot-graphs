<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Global Riot Graphs — Q8</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q8")</script></head><body><main id="issue"><h2 class="desk">Q8. France Week 3</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-11-01-R3.webp" alt="France act III: turnout down 42% from Oct 17, and violence keeps falling" loading="lazy"><figcaption><span class="t">Chart R3 (week of Nov 1, 2026). France act III: turnout down 42% from Oct 17, and violence keeps falling</span><p>Official Interior Ministry tallies for the three national Saturdays of France&#x27;s cost-of-living protests. Turnout fell from 550,000 (Oct 17) to 410,000 (Oct 24) to 320,000 (Oct 31, 70,000 in Paris); the ministry calls it down 22% on Oct 24 and 42% on Oct 17. The youth union coalition claimed nearly 500,000 on Oct 31 (200,000 in Paris), after 800,000 on each of the first two Saturdays. Arrests by 9 pm fell from 2,628 to 1,435 to 565 and injured officers from 1,144 to 267 to 116. Fire interventions rose again to 515 (75 on Oct 24), and shops damaged were 36, 3 of them looted (69 and 24 on Oct 24).</p><ul><li>Including Halloween night, the ministry counted 779 arrests for Oct 31 (214 after 9 pm, against 170 on Halloween 2025).</li><li>Revisions: the ministry now gives Oct 24 as 1,435 arrests and 267 injured officers, up from the 1,314 and 53 first reported (and shown in R2).</li><li>A prosecutor opened an attempted-murder inquiry after a Molotov cocktail was thrown at gendarmes in Paris on Oct 31 (Ouest-France live).</li></ul><p class="nt">Note: Turnout counts are contested: unions count higher, the ministry lower, and neither is independently audited. Arrest counts are as of 9 pm unless stated.</p><p>Sources: <a href="https://www.bfmtv.com/police-justice/manifestations-du-31-octobre-779-interpellations-en-france-sans-incident-majeur-en-seconde-partie-de-soiree_AD-202611010262.html">BFMTV/AFP, Interior Ministry toll for Oct 31 (with Oct 24 and Oct 17 comparisons), Nov 1, 2026</a> <a href="https://www.bfmtv.com/societe/manifestations/manifestations-du-24-octobre-1-314-interpellations-et-53-membres-des-forces-de-l-ordre-blesses-selon-le-ministere-de-l-interieur_AV-202610250147.html">BFMTV, Interior Ministry toll for Oct 24, Oct 25, 2026</a> <a href="https://www.franceinfo.fr/economie/greve/direct-mobilisation-du-31-octobre-suivez-cette-troisieme-journee-de-manifestations-pour-laquelle-le-gouvernement-prevoit-un-dispositif-de-securite-exceptionnel_8260562.html">franceinfo live, Oct 31, 2026</a> <a href="https://www.ouest-france.fr/societe/manifestation/direct-31-octobre-a-paris-enquete-ouverte-pour-tentative-dhomicide-apres-un-jet-de-cocktail-molotov-sur-des-gendarmes-4445bf3b-4cc1-42c0-9be2-825cbaa48d35">Ouest-France live, Oct 31, 2026 (Molotov inquiry)</a></p></figcaption></figure></main></body></html>
