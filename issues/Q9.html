<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Global Riot Graphs — Q9</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q9")</script></head><body><main id="issue"><h2 class="desk">Q9. France Week 4</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-11-08-R5.webp" alt="France act IV: Saturday turnout falls to 146,000 after a larger union Thursday" loading="lazy"><figcaption><span class="t">Chart R5 (week of Nov 8, 2026). France act IV: Saturday turnout falls to 146,000 after a larger union Thursday</span><p>Interior Ministry nationwide turnout for the four consecutive Saturdays of France&#x27;s autumn 2026 cost-of-living protests, plus the Thursday November 5 union day for wages and purchasing power. The ministry, restating earlier Saturdays in its November 7 communiqué, counted 550,000 people on October 17 (430 actions), 410,000 on October 24 (289), 320,000 on October 31 (227) and 146,000 on November 7 (141 actions, including 46,000 in Paris). Thursday November 5 — a different call, by the union intersyndicale — drew 575,000 people on the ministry&#x27;s count (65,000 in Paris, 193 cortèges), more than any Saturday after October 17. Organizers disputed both of this week&#x27;s official figures: the CGT claimed 1.6 million on November 5 (350,000 in Paris) and the youth intersyndicale claimed 250,000 on November 7 (75,000 in Paris).</p><ul><li>November 7 was down 73% from October 17 and 54% from October 31 on the ministry&#x27;s figures (146,000 against 550,000 and 320,000).</li><li>Arrests: the ministry reported 360 at 19:00 on November 7 (232 at 18:00) and 448 at 18:00 on November 5, plus 53 injured officers and 86 fire interventions on November 5. It released no injury count for November 7.</li><li>About 70,000 police and gendarmes were deployed on both November 5 and November 7; on November 7 the ministry also reported about 40,000 preventive checks and 25 gendarmerie armored vehicles plus 15 water cannon.</li><li>Regional Interior counts on November 7 included Lille 10,000, Bordeaux 9,100, Grenoble 6,000, Rennes 5,500 and Marseille 5,200 (TF1 Info). AFP posted both national tallies the same afternoon (https://x.com/afpfr/status/2119115795645014099).</li></ul><p class="nt">Note: Turnout counts are contested: unions count higher, the ministry lower, and neither series is independently audited. Thursday November 5 and the Saturdays were called by different coalitions (union intersyndicale vs youth organizations), so they are not the same march repeated. The October 17, 24 and 31 Interior totals are the figures the ministry itself restated on November 7; organizer claims for those earlier Saturdays were not republished in the articles fetched for this update and are not plotted.</p><p>Sources: <a href="https://www.ici.fr/infos/economie-social/manifestations-du-7-novembre-mobilisation-en-baisse-360-interpellations-selon-le-ministere-de-l-interieur-5284347">ICI / Radio France, Interior Ministry definitive Nov 7 tally (updated Nov 8 2026)</a> <a href="https://www.tf1info.fr/societe/manifestations-146-000-personnes-en-france-samedi-7-novembre-au-moins-360-interpellations-2474538.html">TF1 Info, Interior Ministry Nov 7 nationwide and city counts</a> <a href="https://www.aa.com.tr/fr/france/france-360-interpellations-%C3%A0-19h-apr%C3%A8s-la-mobilisation-du-7-novembre-selon-le-minist%C3%A8re-de-l-int%C3%A9rieur/4115506">Anadolu Agency, Interior Ministry Nov 7 figures (360 arrests at 19h; 232 at 18h)</a> <a href="https://www.franceinfo.fr/economie/greve/greve/pres-de-1-6-million-de-personnes-ont-defile-en-france-lors-de-la-mobilisation-du-5-novembre-selon-la-cgt-575-000-selon-le-ministere-de-l-interieur_8269868.html">franceinfo / AFP, Interior 575,000 and CGT 1.6 million on Nov 5 (published Nov 5 2026)</a> <a href="https://www.bfmtv.com/societe/manifestations/manifestation-du-5-novembre-1-6-million-de-manifestants-d-apres-la-cgt-575-000-selon-le-ministere-de-l-interieur_AD-202611050820.html">BFMTV, Interior 575,000 (65,000 in Paris, 193 cortèges) vs CGT 1.6 million (350,000 in Paris), Nov 5</a> <a href="https://www.tf1info.fr/societe/mobilisation-du-5-novembre-575-000-manifestants-selon-le-ministere-de-l-interieur-trois-fois-plus-pour-la-cgt-2474160.html">TF1 Info, Nov 5 Interior vs CGT counts</a> <a href="https://x.com/afpfr/status/2119115795645014099">AFP on X, Nov 7: youth intersyndicale 250,000 vs Interior 146,000</a></p></figcaption></figure></main></body></html>
