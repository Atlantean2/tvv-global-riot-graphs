<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Global Riot Graphs — Q11</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q11")</script></head><body><main id="issue"><h2 class="desk">Q11. Violence Pulse</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-11-22-R9.webp" alt="World political violence in 2026: events +16% on 2025, deaths -17%" loading="lazy"><figcaption><span class="t">Chart R9 (week of Nov 22, 2026). World political violence in 2026: events +16% on 2025, deaths -17%</span><p>Monthly totals of political violence recorded by ACLED worldwide (battles, explosions and remote violence, violence against civilians, and mob violence), January 2018 to October 2026. October 2026 had 22,713 events and 19,739 reported deaths. In the first ten months of 2026 the monthly averages were 20,472 events and 17,032 deaths, against 17,661 and 20,493 in 2025. The deadliest month in the series was October 2023 with 25,565 deaths. Events have trended up for years while deaths have not, which partly reflects wider coverage: ACLED has added sources and countries over time, so the event line overstates how much the world has really changed. Fatality figures are the most conservative reported estimates and are often revised. November 2026 is left out because the file runs only to mid-month.</p><ul><li>Calendar years (events / deaths): 2018 124,257 / 177,080; 2019 121,054 / 153,006; 2020 103,513 / 138,174; 2021 105,861 / 159,094; 2022 144,282 / 169,920; 2023 171,760 / 198,134; 2024 206,571 / 243,323; 2025 211,937 / 245,921; 2026 through October 204,717 / 170,325.</li><li>In this HDX series political violence means ACLED&#x27;s battles, violence against civilians and explosions/remote violence, plus the mob-violence sub-type of riots; peaceful and most violent protests are counted separately as demonstrations.</li><li>Counts are ACLED&#x27;s, redistributed on HDX under ACLED&#x27;s terms of use; ACLED data are revised as new reports arrive.</li></ul><p>Sources: <a href="https://data.humdata.org/dataset/political-violence-events-and-fatalities">ACLED via HDX: Political violence events and fatalities (country-month, as of Nov 13, 2026)</a> <a href="https://acleddata.com/terms-of-use/">ACLED terms of use and methodology</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-22-R10.webp" alt="October deaths: Ukraine led, but Yemen ran at 19x its 2025 monthly pace" loading="lazy"><figcaption><span class="t">Chart R10 (week of Nov 22, 2026). October deaths: Ukraine led, but Yemen ran at 19x its 2025 monthly pace</span><p>The 15 countries with the most reported political-violence deaths in October 2026, from ACLED, set against each country&#x27;s 2025 monthly average. Ukraine led with 4,771. Ratios above 1 mean October was deadlier than a typical 2025 month. Yemen stands out: ACLED recorded 4,490 deaths there in October against a 2025 average of 242, as the government&#x27;s offensive against the Houthis on the Taiz, Lahj and Marib fronts escalated; Yemen&#x27;s health emergency centre counted 1,677 deaths and 7,395 injuries since the escalation began, as of Oct 25 (WHO situation report). Most other large conflicts, including Ukraine, Sudan and Myanmar, were less deadly in October than their 2025 average. Single-month counts swing with one large battle or massacre, so a high ratio is a flag to watch, not a trend. ACLED counts are conservative and depend on media and partner reporting, which is thin in places such as Sudan, Myanmar and the Sahel, so true tolls there are likely higher.</p><ul><li>Ukraine: October 4,771 vs 2025 average 6,408 (0.7x)</li><li>Yemen: October 4,490 vs 2025 average 242 (18.5x)</li><li>Sudan: October 1,206 vs 2025 average 1,565 (0.8x)</li><li>Nigeria: October 1,137 vs 2025 average 1,314 (0.9x)</li><li>Myanmar: October 858 vs 2025 average 1,326 (0.6x)</li><li>Ethiopia: October 838 vs 2025 average 522 (1.6x)</li><li>Brazil: October 785 vs 2025 average 756 (1.0x)</li><li>Somalia: October 696 vs 2025 average 815 (0.9x)</li><li>Pakistan: October 688 vs 2025 average 444 (1.6x)</li><li>Burkina Faso: October 479 vs 2025 average 440 (1.1x)</li><li>Mexico: October 478 vs 2025 average 677 (0.7x)</li><li>South Sudan: October 375 vs 2025 average 260 (1.4x)</li><li>Democratic Republic of Congo: October 259 vs 2025 average 613 (0.4x)</li><li>Ecuador: October 255 vs 2025 average 339 (0.8x)</li><li>Haiti: October 249 vs 2025 average 402 (0.6x)</li></ul><p>Sources: <a href="https://data.humdata.org/dataset/political-violence-events-and-fatalities">ACLED via HDX: Political violence events and fatalities (country-month, as of Nov 13, 2026)</a> <a href="https://acleddata.com/terms-of-use/">ACLED terms of use and methodology</a> <a href="https://www.emro.who.int/images/stories/yemen/Yemen-Conflict-Escalation-Situation-Report-09.pdf">WHO EMRO: Yemen Conflict Escalation Situation Report #9</a> <a href="https://www.aljazeera.com/news/2026/10/18/fighting-intensifies-across-yemen-as-humanitarian-crisis-deepens">Al Jazeera: Fighting intensifies across Yemen as humanitarian crisis deepens (Oct 18, 2026)</a></p></figcaption></figure></main></body></html>
