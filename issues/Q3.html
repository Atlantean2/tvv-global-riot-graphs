<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Global Riot Graphs — Q3</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q3")</script></head><body><main id="issue"><h2 class="desk">Q3. France: Anatomy of the October Wave</h2><figure class="g"><img src="img/G05.webp" alt="Graph 5" loading="lazy"><figcaption><p>Graph 5. France: weekly share of French-sourced online news coverage mentioning protest/riot terms vs riot/looting-only terms (GDELT), 24 months. The riot/looting line is the better gauge of violence salience; both lines jump in late September and again after Oct 17. Source: GDELT DOC 2.0 API, timelinevolraw, sourcecountry:france (<a href="https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/" target="_blank" rel="noopener">GDELT DOC 2.0 API</a>). The mid-2025 gap is missing monitored-article totals in the feed.</p></figcaption></figure>
<figure class="g"><img src="img/G06.webp" alt="Graph 6" loading="lazy"><figcaption><p>Graph 6. Turnout: Gilets jaunes &quot;Actes&quot; (2018-19, Interior Ministry) vs Oct 17, 2026. Acte I on Nov 17, 2018 drew 287,700 by the ministry count; by the same count, Oct 17, 2026 (550,000) was nearly double that, though it was a joint union-student-GJ day, not a GJ Acte. Sources: Interior Ministry figures compiled in <a href="https://fr.wikipedia.org/wiki/Mouvement_des_Gilets_jaunes" target="_blank" rel="noopener">fr.wikipedia: Mouvement des Gilets jaunes</a>; 2026 count via <a href="https://www.franceinfo.fr/economie/greve/mobilisation-du-17-octobre-800-000-personnes-ont-manifeste-dans-toute-la-france-selon-les-organisateurs-550-000-selon-le-ministre-de-l-interieur_8242081.html" target="_blank" rel="noopener">franceinfo: 550,000 (ministry) vs 800,000 (organisers)</a>.</p></figcaption></figure>
<figure class="g"><img src="img/G07.webp" alt="Graph 7" loading="lazy"><figcaption><p>Graph 7. Official tallies: 2023 Nahel riots (11+ nights) vs one weekend in October 2026. 2023: 3,505 arrests (Darmanin, Jul 5, 2023, <a href="https://www.tf1info.fr/justice-faits-divers/mort-de-nahel-gerald-darmanin-revele-les-chiffres-apres-une-semaine-de-violences-urbaines-2262684.html" target="_blank" rel="noopener">TF1 Info: Darmanin&#x27;s 2023 toll</a>); custody, injured officers and more than 1,000 shops per the Senate report (<a href="https://www.senat.fr/rap/r23-521/r23-521.html" target="_blank" rel="noopener">Senate report no. 521 (2023-24)</a>). 2026: about 2,400 arrests and about 1,000 officers injured (Interior Ministry), 2,513 in custody (<a href="https://lcp.fr/actualites/2513-gardes-a-vue-les-violences-du-17-octobre-s-invitent-dans-une-audition-de-gerald" target="_blank" rel="noopener">LCP, Oct 20</a>), at least 3,000 shops (<a href="https://www.ouest-france.fr/societe/manifestation/direct-manifestations-sebastien-lecornu-demande-aux-prefets-dinstaurer-des-couvre-feux-partiels-et-localises-025d6c92-e57f-4014-b92a-7627ffeb6608" target="_blank" rel="noopener">Ouest-France live, Oct 19</a>). No official national count of burned vehicles for 2026 was found.</p></figcaption></figure></main></body></html>
