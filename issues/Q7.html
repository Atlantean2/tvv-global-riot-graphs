<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Global Riot Graphs — Q7</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q7")</script></head><body><main id="issue"><h2 class="desk">Q7. France Week Two</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-10-25-R2.webp" alt="France, week two of the cost-of-living revolt: crowds hold, violence collapses" loading="lazy"><figcaption><span class="t">Chart R2 (week of Oct 25, 2026). France, week two of the cost-of-living revolt: crowds hold, violence collapses</span><p>Official Interior Ministry tallies for the two national Saturdays. Turnout fell about a quarter (550,000 to 410,000; the CGT union claimed about 800,000 both times), but violence fell far more: arrests halved (2,628 to 1,314), injured officers fell from 1,144 to 53, shops looted from 1,522 to 24 and fire interventions from 2,025 to 75. The ministry credits pre-positioned, mobile policing, while saying radical groups were &#x27;as violent as last week&#x27;. Lyon saw some 10,000 marchers in unauthorised processions dispersed with tear gas. Note: the ministry&#x27;s Oct 17 arrest and injury figures were revised up from the &#x27;nearly 2,400&#x27; and &#x27;nearly 1,000&#x27; used in our Oct 22 study. All figures are provisional.</p><p>Sources: <a href="https://www.bfmtv.com/societe/manifestations/manifestations-du-24-octobre-1-314-interpellations-et-53-membres-des-forces-de-l-ordre-blesses-selon-le-ministere-de-l-interieur_AV-202610250147.html">BFMTV, Interior Ministry toll for Oct 24 and Oct 17, Oct 25, 2026</a> <a href="https://www.franceinfo.fr/societe/manifestations/pres-de-410-000-personnes-ont-manifeste-en-france-d-apres-le-ministere-de-l-interieur-800-000-selon-la-cgt-des-tensions-dans-plusieurs-grandes-villes_8252440.html">franceinfo/AFP turnout, Oct 24, 2026</a></p></figcaption></figure></main></body></html>
