<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Global Riot Graphs — Q6</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q6")</script></head><body><main id="issue"><h2 class="desk">Q6. Europe Wave</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-10-25-R1.webp" alt="Europe&#x27;s autumn 2026 protest wave: monthly demonstration events vs normal" loading="lazy"><figcaption><span class="t">Chart R1 (week of Oct 25, 2026). Europe&#x27;s autumn 2026 protest wave: monthly demonstration events vs normal</span><p>ACLED demonstration events (protests plus riots) per month. Labels show the October 1-21 count as a multiple of each country&#x27;s average month in 2020-2025. France: avg 593, Sep 1,181, Oct 1-21 1,676 (2020-25 record 2,108 in Mar 2023); Spain: avg 323, Sep 558, Oct 1-21 268 (2020-25 record 852 in Mar 2022); Italy: avg 378, Sep 239, Oct 1-21 239 (2020-25 record 880 in Feb 2022); Portugal: avg 39, Sep 28, Oct 1-21 22 (2020-25 record 89 in Jan 2024); Serbia: avg 71, Sep 43, Oct 1-21 24 (2020-25 record 421 in Feb 2025); Albania: avg 10, Sep 31, Oct 1-21 29 (2020-25 record 45 in Apr 2021). The wave is mostly French: France&#x27;s first three weeks of October already ran 2.8 times its normal month. Albania (small numbers, but nearly 3x normal) and Spain&#x27;s September spike are the other outliers; Italy, Portugal and Serbia are at or below their 2020-25 norm, so &#x27;Europe in revolt&#x27; headlines overstate it. ACLED&#x27;s cut-off of Oct 21 misses France&#x27;s Oct 24 day, so expect upward revisions.</p><p>Sources: <a href="https://data.humdata.org/dataset/france-acled-conflict-data">ACLED aggregated monthly data via HDX (as of Oct 21, 2026), e.g. France</a> <a href="https://data.humdata.org/dataset/spain-acled-conflict-data">Spain</a> <a href="https://data.humdata.org/dataset/italy-acled-conflict-data">Italy</a> <a href="https://data.humdata.org/dataset/albania-acled-conflict-data">Albania</a></p></figcaption></figure></main></body></html>
